# Production stack — builds YOUR Intelyhood/Intelychat code (not upstream Chatwoot image).
# Usage:
#   cp .env.example .env   # then edit FRONTEND_URL, secrets, DB/Redis passwords
#   docker compose -f docker-compose.production.yaml up -d --build
version: '3.8'

services:
  base: &base
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: intelyhood_chat:production
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always
    # 4 vCPU / 8GB VPS — leave headroom for postgres + docker builds
    cpus: 1.5
    mem_limit: 1536m

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always
    cpus: 1.0
    mem_limit: 1024m

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-intelychat}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: 1.0
    mem_limit: 1536m

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    cpus: 0.5
    mem_limit: 256m

  # Optional lightweight Postgres browser UI. Bound to localhost only — reach it
  # via an SSH tunnel (ssh -L 8081:127.0.0.1:8081 <host>), then open
  # http://localhost:8081. Start with:
  #   docker compose -f docker-compose.production.yaml --profile with-pgweb up -d pgweb
  pgweb:
    image: sosedoff/pgweb
    restart: always
    profiles: ['with-pgweb']
    ports:
      - '127.0.0.1:8081:8081'
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-intelychat}?sslmode=disable
    depends_on:
      - postgres
    cpus: 0.25
    mem_limit: 128m

  # Optional reverse proxy when you do not use host nginx yet
  caddy:
    image: caddy:2-alpine
    restart: always
    profiles: ['with-caddy']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deployment/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - rails

volumes:
  storage_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
