name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
      - intelychat-main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name — see deployment/VPS_DEPLOY.md"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -euo pipefail
            APP_DIR='${{ secrets.VPS_APP_DIR }}'
            if [ -z "$APP_DIR" ]; then APP_DIR=/opt/intelyhood_chat; fi
            BRANCH='${{ secrets.VPS_DEPLOY_BRANCH }}'
            if [ -z "$BRANCH" ]; then BRANCH=main; fi
            export APP_DIR
            export DEPLOY_BRANCH="$BRANCH"
            chmod +x "$APP_DIR/deployment/vps/deploy.sh"
            bash "$APP_DIR/deployment/vps/deploy.sh"
